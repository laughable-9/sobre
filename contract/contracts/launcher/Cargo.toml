[package]
name = "sobre-launcher"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sobre = { path = "../sobre", features = ["testutils"] }
sobre-factory = { path = "../factory" }
mock-usdy = { path = "../mock-usdy", features = ["testutils"] }
blend-contract-sdk = { workspace = true, features = ["testutils"] }
